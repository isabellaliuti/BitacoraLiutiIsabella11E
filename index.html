<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Liuti Isabella</title>

    <link rel="icon" type="image/x-icon" href="https://play-lh.googleusercontent.com/DpEIcJPiSQJb22lYSAnerRC5IlDt94itECqtlqhh97vKziX6LV8pyScGBCWiRfKCSMM">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fafafa;
        }
        body {
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: burlywood;
            color: white;
        }
        
        h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin: 0;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .logo-colegio {
            transition: transform 0.3s ease;
            cursor: pointer;
            width: 100px;
        }
        .logo-colegio:hover {
            transform: scale(1.1);
        }
        .logo-colegio:active {
            transform: scale(1.5); 
        }

        .semana {
            background-color: burlywood;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #d2a679;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-align: left;
            color: white;
        }
        .semana:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .semana h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .visor-pdf, .video-local {
            width: 100%;
            border: 2px solid white;
            background-color: white;
            border-radius: 10px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .visor-pdf {
            height: 500px;
        }

        .video-local {
            background-color: #000;
        }

        .boton-descarga {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: white;
            color: burlywood;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .boton-descarga:hover {
            background-color: #f5f5f5;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid burlywood;
            background-color: burlywood;
            color: white;
        }

        /* Ajuste para celulares */
        @media (max-width: 600px) {
            .visor-pdf { height: 300px; }
            footer { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Bitácora Segunda y Tercera Unidad</h1>
    </header>

    <main>
        <div class="semana">
            <h3>Semana 1: Introducción Arduino</h3>
            <iframe src="recursos/Introducción Arduino (4).pdf" class="visor-pdf"></iframe>
            <br>
            <a href="recursos/Introducción Arduino (4).pdf" download class="boton-descarga">Descargar PDF</a>
        </div>

        <div class="semana">
            <h3>Semana 2: Sensores y Actuadores</h3>
            <video controls class="video-local">
                <source src="videos/IntroRobo.mp4" type="video/mp4">
            </video>

            <br>
        </div>
    </main>

    <footer>
        <span>@Isabellaliuti</span>
        <img src="https://www.capouilliez.edu.gt/assets/img/logo.png" height="25" width="100" alt="Logo Colegio" class="logo-colegio">
    </footer>

</body>
</html>
